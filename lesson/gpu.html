<!doctype html>
<html lang="en">
<head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta charset="utf-8">

<title>Kernels on the RTX 4090</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--paper:#F4F1EA;--card:#FBF9F4;--stage:#EBE7DD;--ink:#141411;--ink2:#3F3E39;--line:#D8D3C6;--acc:#1F7F67;--acc2:#A9681E;--good:#2F8A55;--bad:#B5443A;--dot:#D8D3C6;
--code:#EFEBE2;--disp:'Instrument Serif',Georgia,serif;--font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F100E;--card:#171815;--stage:#131411;--ink:#ECE9E1;--ink2:#B9B5AA;--line:#2A2B26;--acc:#8FD3BD;--acc2:#E0A458;--dot:#2A2B26;--code:#121310;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F100E;--card:#171815;--stage:#131411;--ink:#ECE9E1;--ink2:#B9B5AA;--line:#2A2B26;--acc:#8FD3BD;--acc2:#E0A458;--dot:#2A2B26;--code:#121310;color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{flex:none}
.app{height:100%;display:grid;grid-template-columns:78px minmax(0,1fr) 400px;grid-template-rows:84px minmax(0,1fr) 138px;gap:14px;padding:14px}
.rail{grid-row:1/4;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 2px;border:0;border-radius:14px;background:none;color:var(--ink2);font-size:12px}
.rail button svg{width:25px;height:25px}
.rail button[aria-current]{background:var(--card);color:var(--acc);box-shadow:inset 0 0 0 1px var(--line)}
header.top{grid-column:2;display:flex;align-items:center;gap:16px;min-width:0;position:relative}
header.top .mark{width:54px;height:54px;color:var(--acc)}
header h1{font:700 42px/.92 var(--disp);letter-spacing:.01em;margin:0;text-transform:uppercase;white-space:nowrap}
header h1 span{color:var(--acc2)}
header p{margin:7px 0 0;font:600 14px/1 var(--disp);letter-spacing:.3em;color:var(--ink2);text-transform:uppercase}
header .trace{position:absolute;right:0;top:6px;width:min(420px,40%);height:72px;color:var(--line)}
.prog{grid-column:3;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 18px}
.prog svg{width:34px;height:34px}
.prog .pg{flex:1}
.prog .pg b{font:700 17px var(--disp);letter-spacing:.1em}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.prog .pn{font:700 26px var(--disp)}
.prog small{display:block;color:var(--ink2);font-size:.78rem;text-align:right}
.stage{grid-column:2;position:relative;border-radius:22px;border:1px solid var(--line);overflow:hidden;min-height:0;
 background:radial-gradient(var(--dot) 1px,transparent 1.3px) 0 0/22px 22px,var(--stage)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#callouts,#labels{position:absolute;inset:0;pointer-events:none}
.callout{position:absolute;width:232px;pointer-events:auto;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start}
.callout:hover{border-color:var(--ink2)}
.callout svg{width:26px;height:26px;margin-top:2px}
.callout b{display:block;font:700 18px/1.05 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.callout .prose{display:block;margin-top:3px;font-size:.86rem;line-height:1.35;color:var(--ink2)}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;font:600 12px var(--disp);letter-spacing:.06em;text-transform:uppercase;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
#labels{display:none}
.crumbs{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 6px;max-width:calc(100% - 32px);overflow-x:auto}
.crumbs button{border:0;background:none;padding:3px 7px;border-radius:8px;font:600 14px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.crumbs button[aria-current]{color:var(--ink)}
.crumbs i{color:var(--ink2);font-style:normal}
.task{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 560px));min-width:300px;background:var(--card);border:2px solid var(--acc);border-radius:16px;padding:11px 15px 12px}
.task .tk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.task .tk-h div{display:flex;gap:6px}
.task .tk-h button{border:1px solid var(--line);background:var(--stage);border-radius:8px;padding:2px 8px;font:600 12px var(--font);letter-spacing:0;text-transform:none;color:var(--ink2);display:flex;align-items:center}
.task .tk-h svg{width:14px;height:14px}
.task .tk-t{margin:6px 0 0;font-size:1.02rem}
.task .tk-hint{margin:6px 0 0;color:var(--ink2);font-size:.92rem}
.task .tk-r{margin-top:10px;padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--good) 12%,transparent)}
.task .tk-r p{margin:0}
.task .tk-r a{color:var(--acc)}
.tk-next{margin-top:8px;border:0;border-radius:9px;background:var(--acc);color:#fff;font:700 15px var(--disp);letter-spacing:.08em;text-transform:uppercase;padding:6px 14px}
.task.min .tk-t,.task.min .tk-hint,.task.min .tk-r{display:none}
.legend{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:5px;width:min(560px,calc(100% - 24px));pointer-events:none}
.legend span{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.82rem}
.sw{display:inline-block;flex:none;width:11px;height:11px;border-radius:3px}
#tip{position:absolute;pointer-events:none;display:none;max-width:260px;background:var(--ink);color:var(--card);border-radius:10px;padding:7px 10px;font-size:.85rem;z-index:5}
#tip b{display:block}
#tip i{opacity:.7;font-size:.78rem}
#fade{position:absolute;inset:0;background:var(--stage);opacity:0;pointer-events:none;transition:opacity .22s}
.toolbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;max-width:calc(100% - 24px);overflow-x:auto}
.toolbar button{height:36px;min-width:38px;border:0;border-radius:10px;background:none;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;font:600 13px var(--disp);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.toolbar button:hover{background:var(--stage)}
.toolbar button svg{width:19px;height:19px}
.toolbar button[aria-pressed=true]{background:color-mix(in srgb,var(--acc) 17%,transparent);color:var(--acc)}
.toolbar label{display:flex;align-items:center;gap:6px;font:600 13px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:0 6px}
.toolbar input[type=range]{width:84px;accent-color:var(--acc)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 3px;flex:none}
.fail{position:absolute;inset:auto 0 45% 0;text-align:center;color:var(--ink2)}
.side{grid-column:3;grid-row:2;display:flex;flex-direction:column;gap:14px;min-height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0}
.info{flex:1}
.tabs{display:flex;gap:20px;padding:12px 20px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 0 9px;font:700 16px var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc2)}
.pbody{padding:14px 20px 18px;overflow:auto;flex:1}
.pbody h2{font:700 30px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 10px}
.chip{display:inline-flex;gap:7px;align-items:center;font-size:.82rem;color:var(--ink2)}
.chip svg{width:16px;height:16px}
.pbody p{margin:0 0 10px}
.feat{display:flex;gap:14px;align-items:center;margin:9px 0}
.feat i{flex:none;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center}
.feat i svg{width:22px;height:22px}
.nums{width:100%;border-collapse:collapse}
.nums td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.nums td:last-child{text-align:right;font-family:var(--mono);font-size:.86rem;padding-left:12px}
.kids{display:flex;flex-wrap:wrap;gap:7px}
.kids button{display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--stage);border-radius:9px;padding:5px 10px;font-size:.88rem}
.go{margin-top:14px;width:100%;border:0;border-radius:11px;background:var(--acc);color:#fff;font:700 17px var(--disp);letter-spacing:.08em;text-transform:uppercase;padding:9px}
.off{color:var(--bad)}
.muted{color:var(--ink2)}
.codep .ph{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 10px 18px}
.codep .ph b{font:700 17px var(--disp);letter-spacing:.09em}
.codep .ph div{display:flex;gap:6px}
.codep .ph button{width:36px;height:34px;border:1px solid var(--line);background:var(--stage);border-radius:9px;display:grid;place-items:center}
.codep .ph button svg{width:17px;height:17px}
.codep .ph #run{background:var(--acc2);border-color:var(--acc2);color:#fff;width:44px}
.codep .ph #run:disabled{opacity:.5}
#src{margin:0 12px;padding:8px 0;background:var(--code);border:1px solid var(--line);border-radius:10px;font:13px/1.65 var(--mono);overflow:auto;max-height:190px;white-space:pre}
#src .ln{display:block;padding-right:12px}
#src .ln i{display:inline-block;width:34px;text-align:right;margin-right:12px;color:var(--ink2);font-style:normal;opacity:.6}
#src .ln.on{background:color-mix(in srgb,var(--acc2) 22%,transparent)}
#src b{color:#7C4DCC;font-weight:600}#src var{color:var(--acc);font-style:normal}#src u{color:#C0702B;text-decoration:none}#src s{color:#3B8A4A;text-decoration:none}#src em{color:var(--ink2)}
.mon{margin:8px 12px 12px;border-top:1px dashed var(--line);padding-top:6px;font:12.5px/1.5 var(--mono);max-height:120px;overflow:auto}
.mon b{display:flex;align-items:center;gap:6px;font:700 12px var(--disp);letter-spacing:.14em;color:var(--good)}
.mon b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.mon span{color:var(--ink2);margin-right:6px}
.lessons{grid-column:2/4;grid-row:3;display:flex;flex-direction:column;min-width:0}
.lessons h3{font:700 21px/1 var(--disp);letter-spacing:.08em;margin:2px 0 10px}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.lesson{flex:none;width:280px;height:90px;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 34px 6px 6px;text-align:left;position:relative}
.lesson img,.lesson .ph0{width:112px;height:76px;border-radius:11px;background:var(--stage);object-fit:cover}
.lesson b{font:700 17px/1.1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.lesson[aria-current]{border:2px solid var(--acc2)}
.lesson .ck{position:absolute;top:9px;right:10px;width:19px;height:19px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.lesson .ck.ok{background:var(--good);border-color:var(--good)}
.lesson .ck svg{width:12px;height:12px}
.term{border-bottom:1.5px dotted var(--acc);cursor:help}
.term.rep{border-bottom-color:color-mix(in srgb,var(--acc) 35%,transparent)}
#pop{position:fixed;z-index:60;display:none;max-width:min(330px,92vw);background:var(--card);border:1px solid var(--ink2);border-radius:12px;padding:12px 14px;font-size:.92rem;line-height:1.45}
#pop .pt{display:block;font:700 19px var(--disp);letter-spacing:.04em;text-transform:uppercase}
#pop p{margin:4px 0}#pop .sub{color:var(--ink2)}
#pop .pr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#pop .pr button{font-size:.8rem;padding:2px 8px;border:1px solid var(--line);background:var(--stage);border-radius:7px}
#pop a{color:var(--acc)}
dialog{max-width:min(620px,94vw);width:100%;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:rgb(10 12 20/.5)}
.dlg-h{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.dlg-h input{flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--stage);color:var(--ink);font:inherit}
.dlg-h button{border:1px solid var(--line);background:var(--stage);border-radius:9px;padding:4px 12px}
.dlist{list-style:none;margin:0;padding:4px 16px 14px;max-height:66vh;overflow:auto}
.dlist li{padding:8px 0;border-bottom:1px solid var(--line)}
.dlist ul{list-style:none;padding-left:18px;margin:0}
.dlist button{border:0;background:none;display:flex;gap:8px;align-items:center;padding:2px 0;text-align:left}
@media (max-width:1100px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 62vh auto auto;height:auto;min-height:100%}
 .rail{grid-row:auto;flex-direction:row;overflow-x:auto;order:6}
 .rail button{flex:1;min-width:64px}
 header.top,.prog,.stage,.side,.lessons{grid-column:1;grid-row:auto}
 header h1{font-size:26px;white-space:normal}header .trace{display:none}header.top>div{min-width:0}header.top .mark{width:40px;height:40px}
 .side{min-height:auto}.info{min-height:280px}
 #callouts,#leaders{display:none}#labels{display:block}
 .task{width:calc(100% - 28px);min-width:0;top:56px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 floor with 4 work cells.", "why": "The RTX 4090 has 128 of them; your kernel needs enough blocks to keep them all busy.", "related": ["warp", "partition", "block"], "more": "https://modal.com/gpu-glossary"}, {"id": "partition", "term": "Partition", "short": "One quarter of an SM, with its own warp scheduler, registers and execution lanes.", "aliases": ["partitions", "processing block"], "related": ["sm", "warp-scheduler"]}, {"id": "warp", "term": "Warp", "short": "A group of 32 threads that the SM schedules together and issues one instruction to at a time.", "aliases": ["warps"], "analogy": "A rowing crew of 32 that moves on one drumbeat.", "related": ["thread", "warp-scheduler"]}, {"id": "warp-scheduler", "term": "Warp scheduler", "short": "Hardware that picks a ready warp each clock and issues its next instruction.", "aliases": ["scheduler"], "analogy": "A foreman who always gives work to whoever is ready.", "why": "Switching warps while others wait for memory hides latency.", "related": ["warp", "partition"]}, {"id": "thread", "term": "Thread", "short": "One instance of your kernel code, working on its own piece of data.", "aliases": ["threads"], "related": ["warp", "block"]}, {"id": "block", "term": "Block", "short": "A group of threads (up to 1,024) that runs on one SM and can share its shared memory.", "aliases": ["blocks", "thread block"], "related": ["sm", "shared-memory"]}, {"id": "kernel", "term": "Kernel", "short": "A function you launch on the GPU. Many threads run it at once.", "aliases": ["kernels"], "related": ["thread", "block"]}, {"id": "register-file", "term": "Register file", "short": "The SM's fastest storage. Each thread gets its own registers for its private variables.", "aliases": ["registers", "register"], "analogy": "The worker's own hands: instant, but tiny.", "why": "More registers per thread means fewer threads fit on one SM.", "related": ["thread", "shared-memory"]}, {"id": "shared-memory", "term": "Shared memory", "short": "Fast on-chi
